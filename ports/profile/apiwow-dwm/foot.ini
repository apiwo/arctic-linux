# Arctic Linux - foot, neutral grey and white (no colour tint)
font=JetBrainsMono Nerd Font:size=11, Noto Color Emoji:size=11, Symbols Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:weight=bold:size=11
line-height=18
pad=14x14
dpi-aware=yes

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=0.65
background=141414
foreground=cacaca
selection-background=303030
selection-foreground=ededed

# neutral grayscale ANSI ramp (no hues)
regular0=1c1c1c
bright0=4a4a4a
regular1=b06a6a
bright1=c88a8a
regular2=9a9a9a
bright2=bcbcbc
regular3=aaaaaa
bright3=cccccc
regular4=808080
bright4=a0a0a0
regular5=909090
bright5=b0b0b0
regular6=a0a0a0
bright6=c0c0c0
regular7=cacaca
bright7=ededed
