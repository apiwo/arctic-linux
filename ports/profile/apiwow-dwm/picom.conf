# Arctic Linux - picom for the apiwow-dwm profile.
# Soft shadows and a little transparency, matching the niri rice: nothing
# bouncy, nothing coloured.

backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 26;
shadow-opacity = 0.50;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-color = "#000000";
shadow-exclude = [
  "class_g = 'dwm'",
  "_GTK_FRAME_EXTENTS@:c"
];

# foot is already translucent in its own config; leave it alone here.
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

corner-radius = 8;
rounded-corners-exclude = [ "window_type = 'dock'" ];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
