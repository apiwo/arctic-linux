# Arctic Linux - declarative system configuration
#
# This is the ongoing counterpart to /etc/arctic/install.conf, which only
# matters once, at install time. This one matters every time you run:
#
#     arctic-rebuild
#
# SYS_PACKAGES is the complete, authoritative list of packages that should be
# explicitly installed on this machine - not a list of things to add, the
# actual list. Add a name and rebuild installs it; delete a name and rebuild
# removes it (and anything that was only pulled in as its dependency), the
# same as commenting a package out of a NixOS configuration.nix. Dependencies
# of whatever is listed here are managed for you - do not list them yourself.
#
# SYS_SERVICES works the same way for what should be enabled at boot.
#
# Every rebuild snapshots first if the root filesystem is btrfs (the same
# mechanism alpm itself already uses before any install or removal), so
# `arctic rollback` can always put things back the way they were.
#
# This file starts empty on purpose: the first `arctic-rebuild` on a machine
# where it is empty (or does not exist yet) does not remove anything - it
# fills SYS_PACKAGES/SYS_SERVICES in with whatever is already explicitly
# installed and enabled, so the starting point always matches reality. From
# then on, this file is the truth: edit it, then rebuild.

SYS_PACKAGES=""

SYS_SERVICES=""
