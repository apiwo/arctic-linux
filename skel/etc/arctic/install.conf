# Arctic Linux - declarative install configuration
#
# Edit this file, then run:
#
#     arctic-strap
#
# That is the whole install. No menus, nothing else to run first. Every line
# below is commented out and shows what arctic-strap already does if you
# change nothing: a console-only system, the ordinary kernel, no user account,
# root locked. Uncomment whatever you want different and save.
#
# A_DISK is the one setting that changes what "run the install" means:
#
#   - Left commented out: manual mode. Partition and mount a disk yourself
#     first, the traditional way, then run `arctic-strap /mnt` (or wherever
#     you mounted it).
#
#   - Uncommented and pointed at a disk (A_DISK=/dev/sda): arctic-strap
#     partitions that whole disk, formats it, mounts it, installs the base
#     system and everything below, and installs the bootloader - one
#     command, nothing to mount by hand first. Whatever is on that disk now
#     is gone once you run this.

# ---------------------------------------------------------------------- disk
# Uncomment and point at a real device to partition automatically. Whatever
# is on it is erased. Leave commented out for the manual mount-it-yourself path.
#A_DISK=/dev/sda

# Root filesystem: ext4 (default), btrfs, xfs, f2fs, ext3, ext2, zfs (zfs has
# no packaged userspace tools yet - do not pick it until that exists).
#A_FS=ext4

# btrfs only: snapshot before every package install/removal. timeshift,
# snapper, or none.
#A_SNAPSHOT=timeshift

# Encrypt the root filesystem with LUKS2. You will be asked for this
# passphrase every time the machine boots. Not compatible with
# Arctic-small-kernel (no module loader for dm-crypt) or A_FS=zfs (has its
# own native encryption instead).
#A_ENCRYPT=yes
#A_ENCRYPT_PASS=change-me

# Bootloader, BIOS only (EFI always uses Limine): limine (default) or grub,
# if you multi-boot something that expects it.
#A_BOOTLOADER=limine

# ------------------------------------------------------------------- system
# Arctic-base-kernel (default), Arctic-libre-kernel, Arctic-small-kernel,
# Arctic-lts-kernel, Arctic-rt-kernel, Arctic-hardened-kernel.
#A_KERNEL=Arctic-base-kernel

#A_HOSTNAME=arctic

# Graphics driver: auto (default, detects what is actually there), nvidia,
# nouveau, amd, intel, generic.
#A_GPU=auto

# ---------------------------------------------------------------- desktop
# none (default, console only), kde, hyprland, niri, dwl, xfce, dwm, dms.
#A_DESKTOP=niri

# Display/login manager, if a desktop is set above: none, sddm, xdm, greetd.
#A_DM=none

# ---------------------------------------------------------------- account
# With no user set here, the console logs in as root. A_ROOTPASS unset locks
# the root account entirely (doas + a user account only) - the default.
#A_USER=you
#A_USERPASS=change-me
#A_ROOTPASS=change-me
#A_SHELL=/bin/zsh

# --------------------------------------------------------------- network
# offline (default, no network service configured), dhcp, wifi,
# static:<iface>:<addr/cidr>:<gateway>:<dns>
#A_NET=dhcp
#A_WIFI_SSID=your-network
#A_WIFI_PSK=your-passphrase
#A_WIFI_IFACE=wlan0

#A_SSH=yes
#A_FIREWALL=yes
#A_BLUETOOTH=yes
#A_AUDIO=yes

# ------------------------------------------------------------------- locale
#A_LOCALE=en_US.UTF-8
#A_LANG=en_US.UTF-8
#A_KEYMAP=us
#A_TZ=UTC
#A_NTP=yes

# --------------------------------------------------------------------- swap
# none (default), zram, partition (needs A_SWAPDEV), file (needs A_SWAPSIZE).
#A_SWAP=zram
#A_SWAPSIZE=4G
#A_SWAPDEV=/dev/sda3

# SSD trim: auto (default, on when the root device is actually solid-state),
# yes, no.
#A_TRIM=auto

# ------------------------------------------------------------------ fonts
# Space-separated: ttf-jetbrains-mono ttf-nerd-fonts-symbols noto-fonts
# noto-fonts-emoji ttf-dejavu liberation-fonts
#A_FONTS=ttf-jetbrains-mono noto-fonts noto-fonts-emoji

# ------------------------------------------------------------------ packages
# Anything else from the repos, space-separated - search what is available
# with `alpm search <name>` first.
#A_EXTRA=git tmux ripgrep
#A_PKGS=
