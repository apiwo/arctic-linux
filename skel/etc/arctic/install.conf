# Arctic Linux - install configuration
#
# Everything about the install is decided here. Edit this file, then run:
#
#     arctic-install
#
# No arguments, no menus, no target directory to pass. arctic-install
# reads this file, tells you whether it is valid, shows a summary of what
# it is about to do, and asks for confirmation before installing exactly
# what it says.
#
# Every line below is commented out and shows its default. Uncomment the
# ones you want to change. Anything left commented keeps the default.
#
# Values with spaces need quotes:  A_PKGS="git tmux ripgrep"
#
# Multi-line values (A_MOUNTS, A_POST, A_SSH_KEYS) use a quoted string
# that starts right after the = with a newline and ends on its own line:
#
#     A_POST="
#     alpm ins some-package
#     echo hello >> /etc/motd
#     "
#
# =====================================================================
# DISK
# =====================================================================
#
# There are two ways to give Arctic a disk. Pick one.
#
#   1. WHOLE DISK - Arctic partitions and formats it for you.
#      Set A_DISK. Everything on that disk is destroyed.
#
#   2. EXISTING PARTITIONS - you partitioned already (cfdisk, gdisk,
#      whatever), Arctic just uses what you point it at.
#      Set A_ROOT_PART (and A_BOOT_PART if you boot UEFI).
#      Nothing is formatted unless you also say A_FORMAT=yes.
#
# Setting both A_DISK and A_ROOT_PART is an error - it would be
# ambiguous which one wins, so arctic-install refuses instead of guessing.

# --- option 1: whole disk -------------------------------------------
# The entire disk is wiped, partitioned (ESP + root, or BIOS-boot +
# root), and formatted with A_ROOT_FS below.
#A_DISK=/dev/sda

# Leave this much room unpartitioned at the end of the disk, instead of
# giving all of it to root. For a partition you plan to add by hand
# later - a second OS, a data volume, whatever. Whole-disk installs only.
#   20G    500M    1T
#A_DISK_RESERVE=

# --- option 2: existing partitions ----------------------------------
# The root partition. Required if A_DISK is not set.
#A_ROOT_PART=/dev/sda2

# The boot/EFI partition. On UEFI this is your ESP and gets mounted at
# /boot/efi. On BIOS you can leave it unset - the bootloader goes in the
# MBR of whatever disk holds root.
#A_BOOT_PART=/dev/sda1

# Format the partitions above before installing? Default is no, which
# means Arctic mounts them as they are and installs into whatever is
# already there. Say yes to mkfs them first (destroys their contents).
#A_FORMAT=no

# A separate /home partition, if you keep one. Never formatted unless
# A_FORMAT=yes.
#A_HOME_PART=

# =====================================================================
# FILESYSTEMS
# =====================================================================

# Root filesystem. Used when Arctic formats (A_DISK set, or
# A_FORMAT=yes). Ignored when mounting existing partitions as-is.
#   ext4    the safe default
#   btrfs   subvolumes + snapshots + transparent compression
#   xfs     good with very large files
#   ext3    ext2    f2fs    zfs (zfs userspace tools are not packaged yet)
#A_ROOT_FS=ext4

# Boot/ESP filesystem. UEFI firmware only reliably reads vfat, so
# leave this alone unless you know why you are changing it.
#A_BOOT_FS=vfat

# btrfs mount options, used for every subvolume. Only read when the
# root filesystem is btrfs.
#A_BTRFS_OPTS="rw,noatime,compress=zstd:3,space_cache=v2"

# btrfs subvolumes to create. @ is root itself and always required; the
# rest are recognised by name and mounted at a fixed place each -
# @home -> /home, @snapshots -> /.snapshots, @log -> /var/log,
# @cache -> /var/cache (also implied by A_BTRFS_NO_SNAPSHOT_CACHE below).
# Anything else you list is still created, just not auto-mounted - mount
# it yourself with A_MOUNTS (device subvol=name), further down.
#A_BTRFS_SUBVOLS="@ @home @snapshots @log"

# Take a snapshot before every package change?
#   none    off
#   btrfs   btrfs snapshots (needs A_ROOT_FS=btrfs)
#A_SNAPSHOT=none

# =====================================================================
# ENCRYPTION
# =====================================================================

# Full-disk LUKS2 encryption, under whichever filesystem you chose.
# Works with every filesystem except zfs, which has its own.
#A_ENCRYPT=no
#A_ENCRYPT_PASS=change-me

# =====================================================================
# SWAP
# =====================================================================

#   none        no swap
#   file        a swapfile at /swapfile, A_SWAPSIZE big
#   partition   an existing partition, named in A_SWAPDEV
#A_SWAP=none
#A_SWAPSIZE=4G
#A_SWAPDEV=/dev/sda3

# =====================================================================
# INIT
# =====================================================================

# What runs as PID 1, and what manages services.
#
#   busybox    the default - busybox init, /etc/rc.boot, /etc/rc.d scripts.
#              Nothing extra to install, and what every Arctic service
#              script is written against.
#   openrc     dependency-based, from Gentoo. /etc/init.d + rc-update.
#   sysvinit   the traditional one. /etc/inittab + /etc/init.d.
#   runit      tiny supervision. /etc/service, sv up/down.
#   dinit      dependency handling without the size. dinitctl.
#   systemd-libre  units, journald, the usual suite, built without the
#              nonfree firmware loading paths. Not packaged yet.
#
# busybox, openrc, sysvinit, runit and dinit are all packaged and working.
#
# Choosing anything other than busybox installs that init and its service
# package, and translates the services Arctic enables into that init's own
# format. If the packages for a choice are not available, the installer says
# so and uses busybox init rather than producing a machine that cannot boot.
# See A_SERVICES and the desktop/audio options - those are declared the
# same way regardless of which init ends up running them.
#A_INIT=busybox

# =====================================================================
# KERNEL
# =====================================================================

#   Arctic-base-kernel    default, broad hardware support
#   Arctic-kernel         6.12 LTS + ZEN patchset (PDS/BMQ, ntsync, vhba)
#   Arctic-libre-kernel   no binary blobs
#   Arctic-small-kernel   monolithic, no modules, fast boot
#   Arctic-rt-kernel      realtime preemption
#   Arctic-hardened-kernel
#A_KERNEL=Arctic-base-kernel

# Install CPU microcode. auto picks intel-ucode or amd-ucode by reading
# /proc/cpuinfo.
#   auto    intel    amd    none
#A_MICROCODE=auto

# =====================================================================
# SYSTEM
# =====================================================================

#A_HOSTNAME=arctic
#A_TZ=UTC
#A_LOCALE=en_US.UTF-8
#A_LANG=en_US.UTF-8
#A_KEYMAP=us

# Console font, from whatever /usr/share/consolefonts (or the kernel's
# built-in set) offers. Leave unset for Arctic's own default.
#A_CONSOLE_FONT=

# Sync the clock over NTP at boot.
#A_NTP=yes

# Periodic TRIM for SSDs. auto enables it only on non-rotational disks.
#   auto    yes    no
#A_TRIM=auto

# =====================================================================
# ACCOUNTS
# =====================================================================

# Your user account. Left empty, no user is created and you log in as
# root.
#A_USER=
#A_USERPASS=

# Root password. Left empty, the root account is locked - which is what
# you want if A_USER can use doas. A_LOCK_ROOT below does the same thing
# more explicitly, and wins if both are set.
#A_ROOTPASS=

# Lock the root account outright once A_USER exists, so all
# administration goes through doas. Ignored (with a warning) if A_USER
# is empty - that would leave no way in at all.
#A_LOCK_ROOT=no

# Login shell for the new user.
#   /bin/zsh    /bin/sh    /bin/bash
#A_SHELL=/bin/zsh

# Extra groups for A_USER, beyond the defaults (wheel, users).
#A_USER_GROUPS="wheel users audio video input"

# Let members of wheel use doas without typing a password every time.
#A_DOAS_NOPASS=no

# Public keys for A_USER's authorized_keys (root's, if A_USER is empty),
# one per line, exactly as they appear in a .pub file. Written regardless
# of A_SSH - useful even if you plan to turn A_SSH on later by hand.
#A_SSH_KEYS="
#ssh-ed25519 AAAA... you@yourmachine
#"

# =====================================================================
# NETWORK
# =====================================================================

#   offline     no networking configured
#   dhcp        wired DHCP on whatever interface comes up
#   wifi        wireless via iwd, using the credentials below
#   static      a fixed address, set in A_IP/A_GATEWAY/A_DNS
#A_NET=offline

#A_WIFI_SSID=
#A_WIFI_PSK=
#A_WIFI_IFACE=

#A_IP=192.168.1.50/24
#A_GATEWAY=192.168.1.1
#A_DNS="1.1.1.1 9.9.9.9"

# Randomise the MAC address iwd presents per wireless network, instead
# of broadcasting the adapter's real one. See iwd.config(5)'s
# AddressRandomization for exactly what "per network" means.
#A_MAC_RANDOMIZE=no

# Run an SSH server.
#A_SSH=no

# Disallow SSH password authentication (keys only). Only meaningful
# with A_SSH=yes - put your key in A_SSH_KEYS above first.
#A_SSH_PASSWORD_AUTH=yes

# Enable the firewall (nftables, deny inbound by default).
#A_FIREWALL=yes

# =====================================================================
# DESKTOP
# =====================================================================

# A desktop profile installs the whole environment in one go - the
# session, its own applications, a display manager, fonts and audio.
#   none      console only
#   xfce      XFCE4 + LightDM
#   kde       KDE Plasma + SDDM
#   niri      Niri, a scrollable-tiling Wayland compositor
#   dwm       dwm, suckless and tiny
#A_DESKTOP=none

# Display manager. Leave unset and the desktop profile picks its own
# (lightdm for xfce, sddm for kde). "none" means log in on the console
# and start the session yourself.
#   none    lightdm    sddm    greetd
#A_DM=

# Graphics driver. auto reads the PCI bus and installs what is
# actually there.
#   auto    nvidia    nouveau    amd    intel    generic
#A_GPU=auto

# =====================================================================
# AUDIO
# =====================================================================

# The sound profile installs pipewire, wireplumber and the ALSA
# compatibility layer, enables the services, and adds alsamixer for
# when you need to poke at levels directly.
#   no     none at all
#   yes    the full pipewire stack (same as A_PKGS="arctic-sound")
#A_AUDIO=no

# Bluetooth (bluez + the pipewire bluetooth backend).
#A_BLUETOOTH=no

# =====================================================================
# PACKAGES
# =====================================================================

# Extra packages, on top of everything implied above. These are plain
# alpm package names, space separated.
#A_PKGS="git tmux ripgrep fd bat"

# Package sets, for when you want a category rather than a list of
# names. Space separated, more than one at once is fine.
#   devel    cmake, llvm, meson, ninja, pkgconf, gmake, gdb
#   net      curl, wget, rsync, openssh, nmap
#   media    ffmpeg, mpv
#   office   libreoffice
#   virt     qemu, libvirt, docker, podman, containerd, crun, conmon
#   gaming   wine, steam, gamemode, gamescope, dxvk
#   cli      ripgrep, fd, bat, eza, fzf, zoxide
#A_SETS=""

# Install pkgit alongside alpm. alpm stays the package manager the system
# itself is built and managed with - this only adds pkgit next to it for
# whatever you want to use it for.
#A_PKGIT=no

# Fonts. Space separated.
#   jetbrains-mono  nerd-fonts-symbols  noto  noto-emoji  dejavu  liberation
#A_FONTS="jetbrains-mono noto"

# Extra services to enable at boot, beyond what the choices above
# already turn on. These are names under /etc/rc.d.
#A_SERVICES=""

# =====================================================================
# SECURITY
# =====================================================================

# Mount /tmp as a tmpfs with nosuid,nodev,noexec. /tmp is already a
# tmpfs by default (see /etc/fstab); this only adds noexec to it, which
# breaks anything that tries to execute straight out of /tmp.
#A_HARDEN_TMP=no

# =====================================================================
# STORAGE
# =====================================================================

# Extra mounts to write into /etc/fstab, one per line:
#     <device> <mountpoint> <filesystem> <options>
# Devices may be /dev/..., UUID=... or LABEL=...
#A_MOUNTS="
#UUID=1234-5678 /data ext4 defaults,noatime
#LABEL=backup   /mnt/backup xfs defaults,nofail
#"

# Create a btrfs subvolume for /var/cache too, so it stays out of
# snapshots. Only used when the root filesystem is btrfs - shorthand for
# adding @cache to A_BTRFS_SUBVOLS yourself.
#A_BTRFS_NO_SNAPSHOT_CACHE=no

# =====================================================================
# ZRAM
# =====================================================================

# Compressed swap in RAM. Worth having on any machine with less memory
# than it would like, and it composes with A_SWAP rather than replacing
# it - zram takes priority, the disk swap catches the overflow.
#A_ZRAM=no
#A_ZRAM_SIZE=50%
#A_ZRAM_ALGO=zstd

# =====================================================================
# AFTER THE INSTALL
# =====================================================================

# Commands to run inside the new system once everything else is done,
# one per line. They run under /bin/sh as root, with the target as /.
# Anything that fails is logged and does not abort the install.
#A_POST="
#alpm ins some-package
#echo 'something' >> /etc/some.conf
#"

# Drop to a shell inside the new system before showing the finished
# summary, so you can look around or fix something by hand. /dev, /proc
# and /sys are bound in first, so the shell can do real work in there;
# type exit to continue.
#A_CHROOT_SHELL=no

# Reboot as soon as the install finishes, no prompt.
#A_REBOOT=no

# =====================================================================
# BOOT
# =====================================================================
#
# What actually gets booted, and how. This is deliberately last - by
# the time you are choosing a boot timeout or extra kernel arguments,
# everything above it has already decided what there is to boot.

# Firmware. Leave unset and Arctic uses however this machine booted -
# UEFI if /sys/firmware/efi exists, BIOS otherwise.
#   efi    bios
#A_BOOT_FW=

# Bootloader. Limine is the default and handles both UEFI and BIOS.
# GRUB is there for multi-booting alongside something that expects it.
#   limine    grub
#A_BOOTLOADER=limine

# Where the ESP gets mounted. Only used on UEFI.
#A_BOOT_MOUNT=/boot/efi

# Extra kernel command line arguments, appended to every boot entry.
#A_KERNEL_ARGS=""

# Seconds the boot menu waits before booting the default entry.
#A_BOOT_TIMEOUT=3

# How many previous generations to show in the boot menu. Every
# arctic-rebuild writes a new one, so you can always boot back into a
# configuration that worked. 0 turns generations off entirely.
#A_GENERATIONS=5
