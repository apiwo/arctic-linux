# alpm.conf - Arctic Linux Package Manager
#
# Repositories live in /etc/alpm/repos.d/*.repo, one file each.
# Anything here can be overridden by an environment variable of the same name.

# Where packages land. Change this to install into a different tree, or use
# alpm --root=/mnt for a one-off.
ALPM_ROOT=/

# Architecture this system installs.
ALPM_ARCH=x86_64

# Parallel jobs for source builds. Defaults to the CPU count.
# ALPM_JOBS=8

# Colour: auto, always or never.
ALPM_COLOR=auto

# Keep this many transactions for 'alpm rollback'. Older ones are pruned.
ALPM_KEEP_TRANSACTIONS=20

# Source builds are tuned for this exact CPU when set to 1. Binary packages are
# always built for a generic x86_64.
ARCTIC_NATIVE=0

# Never touch these, whatever a transaction asks for.
ALPM_NEVER_REMOVE="glibc busybox toybox alpm arctic-base"

# Snapshots. On a btrfs root, alpm takes a snapshot before every install and
# every removal, so a package change can always be undone - separately from
# alpm's own file-level rollback. Set to "off" to disable.
#   auto  snapshot when / is btrfs and arctic-snapshot is present (default)
#   off   never
ALPM_SNAPSHOT=auto
